spring.application.name=PrevisionBudgetaire

# Serveur
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/prevision
spring.datasource.username=postgres
spring.datasource.password=mouhamed
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Force le commit immédiat (pour debug)
spring.jpa.properties.hibernate.jdbc.batch_size=0
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Désactivez temporairement le cache de second niveau
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
# Logging
logging.level.com.example.prevision=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# JSON
spring.jackson.serialization.write-dates-as-timestamps=false
